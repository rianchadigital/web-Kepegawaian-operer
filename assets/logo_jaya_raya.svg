<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 190" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Pentagon Shield -->
  <path d="M 80,8 L 148,32 L 138,136 L 80,182 L 22,136 L 12,32 Z" 
        fill="url(#goldBorder)" stroke="#b45309" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Inner Shield -->
  <path d="M 80,16 L 140,38 L 130,130 L 80,172 L 30,130 L 20,38 Z" 
        fill="#0284c7" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Top Banner Ribbon (JAYA RAYA) -->
  <path d="M 28,30 L 132,30 L 124,54 L 80,48 L 36,54 Z" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="80" y="44" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="12" fill="#dc2626" text-anchor="middle" letter-spacing="2.5">JAYA RAYA</text>

  <!-- Blue Sea Waves Base -->
  <path d="M 32,126 Q 56,115 80,126 Q 104,137 128,126 L 128,130 L 80,170 L 32,130 Z" fill="#0369a1"/>
  <path d="M 40,138 Q 60,130 80,138 Q 100,146 120,138" stroke="#ffffff" stroke-width="2" fill="none"/>
  <path d="M 48,150 Q 64,144 80,150 Q 96,156 112,150" stroke="#ffffff" stroke-width="2" fill="none"/>

  <!-- Monas Monument Base -->
  <path d="M 62,118 L 98,118 L 94,108 L 66,108 Z" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
  <path d="M 68,108 L 92,108 L 88,100 L 72,100 Z" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>
  
  <!-- Monas Obelisk Shaft -->
  <path d="M 74,100 L 86,100 L 83,62 L 77,62 Z" fill="#ffffff" stroke="#64748b" stroke-width="1"/>

  <!-- Monas Golden Flame -->
  <path d="M 80,48 C 74,54 75,60 80,62 C 85,60 86,54 80,48 Z" fill="#eab308" stroke="#ca8a04" stroke-width="1"/>
  <path d="M 80,51 C 77,55 78,59 80,61 C 82,59 83,55 80,51 Z" fill="#ef4444"/>

  <!-- Left: Padi (Golden Rice grains) -->
  <g fill="#fbbf24" stroke="#b45309" stroke-width="0.8">
    <ellipse cx="50" cy="110" rx="3.5" ry="6" transform="rotate(-30 50 110)"/>
    <ellipse cx="44" cy="98" rx="3.5" ry="6" transform="rotate(-20 44 98)"/>
    <ellipse cx="42" cy="84" rx="3.5" ry="6" transform="rotate(-5 42 84)"/>
    <ellipse cx="44" cy="70" rx="3.5" ry="6" transform="rotate(15 44 70)"/>
    <ellipse cx="50" cy="58" rx="3.5" ry="6" transform="rotate(35 50 58)"/>
  </g>

  <!-- Right: Kapas (White Cotton Flowers with Green Sepals) -->
  <g>
    <!-- Cotton flower 1 -->
    <circle cx="110" cy="110" r="5.5" fill="#ffffff" stroke="#15803d" stroke-width="1"/>
    <circle cx="110" cy="110" r="3" fill="#ffffff"/>
    <path d="M 110,115 L 108,118 L 112,118 Z" fill="#15803d"/>
    <!-- Cotton flower 2 -->
    <circle cx="116" cy="96" r="5.5" fill="#ffffff" stroke="#15803d" stroke-width="1"/>
    <path d="M 116,101 L 114,104 L 118,104 Z" fill="#15803d"/>
    <!-- Cotton flower 3 -->
    <circle cx="118" cy="82" r="5.5" fill="#ffffff" stroke="#15803d" stroke-width="1"/>
    <path d="M 118,87 L 116,90 L 120,90 Z" fill="#15803d"/>
    <!-- Cotton flower 4 -->
    <circle cx="116" cy="68" r="5.5" fill="#ffffff" stroke="#15803d" stroke-width="1"/>
    <path d="M 116,73 L 114,76 L 118,76 Z" fill="#15803d"/>
    <!-- Cotton flower 5 -->
    <circle cx="110" cy="56" r="5.5" fill="#ffffff" stroke="#15803d" stroke-width="1"/>
    <path d="M 110,61 L 108,64 L 112,64 Z" fill="#15803d"/>
  </g>

  <!-- Golden Rope / Ribbon Tie at Bottom -->
  <path d="M 70,122 Q 80,126 90,122 Q 80,128 70,122 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
</svg>
